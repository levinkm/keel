name: keel
description: "Personal ledger and budgeting app."
publish_to: 'none'

version: 1.0.2+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_bloc: ^9.1.1

  # DI
  get_it: ^9.2.1

  # Functional programming
  dartz: ^0.10.1

  # Code generation
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # Navigation
  go_router: ^18.0.0

  # Local DB
  sqflite: ^2.4.2
  path_provider: ^2.1.5
  path: ^1.9.1

  # UI
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.2.0
  google_fonts: ^8.2.1
  flutter_screenutil: ^5.9.3
  intl: ^0.20.2
  iconsax: ^0.0.8

  # Utils
  equatable: ^2.0.7
  logger: ^2.6.2
  shared_preferences: ^2.5.3
  uuid: ^4.5.1
  file_picker: ^13.3.0
  pdf: ^3.13.1
  printing: ^5.15.1
  local_auth: ^2.3.0
  supabase_flutter: ^2.18.3
  flutter_dotenv: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.10.1
  freezed: ^4.0.0
  json_serializable: ^6.11.1

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/png/
    - assets/png/logos/
