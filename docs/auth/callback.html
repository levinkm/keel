<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Signing in to Keel…</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f1729;
      color: #edf2fc;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      text-align: center;
      padding: 48px 40px;
      background: #1b2638;
      border: 1px solid #34435a;
      border-radius: 16px;
      max-width: 360px;
      width: 90%;
    }
    .icon {
      width: 64px; height: 64px;
      border-radius: 16px;
      margin: 0 auto 20px;
      overflow: hidden;
      background: rgba(65,105,225,0.1);
    }
    .icon img { width: 100%; height: 100%; object-fit: cover; }
    h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; margin-bottom: 8px; }
    p { font-size: 13px; color: #a8b4c8; line-height: 1.6; }
    .spinner {
      width: 24px; height: 24px;
      border: 2px solid #34435a;
      border-top-color: #4169e1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 24px auto 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .success { display: none; }
    .check-icon { font-size: 40px; margin-bottom: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <img src="https://raw.githubusercontent.com/levinkm/keel/main/assets/png/logos/keel_icon_1024.png" alt="Keel" />
    </div>
    <div id="loading">
      <h1>Signing you in…</h1>
      <p>Redirecting back to Keel.<br>This tab will close automatically.</p>
      <div class="spinner"></div>
    </div>
    <div class="success" id="success">
      <div class="check-icon">✓</div>
      <h1>Signed in successfully</h1>
      <p>You can close this tab and return to Keel.</p>
    </div>
  </div>
  <script>
    (function () {
      var hash = window.location.hash;
      var search = window.location.search;
      var fragment = hash || search;
      if (fragment) {
        window.location.href = 'keel://auth/callback' + fragment;
        setTimeout(function () {
          document.getElementById('loading').style.display = 'none';
          document.getElementById('success').style.display = 'block';
          setTimeout(function () { window.close(); }, 1500);
        }, 800);
      } else {
        document.querySelector('h1').textContent = 'Nothing to do here';
        document.querySelector('p').textContent = 'This page handles Keel authentication callbacks.';
        document.querySelector('.spinner').style.display = 'none';
      }
    })();
  </script>
</body>
</html>
