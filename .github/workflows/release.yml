name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build macOS and publish release
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version from pubspec.yaml
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | sed 's/+.*//' | tr -d '[:space:]')
          BUILD=$(grep '^version:' pubspec.yaml | sed 's/.*+//' | tr -d '[:space:]')
          COMMIT=$(git rev-parse --short HEAD)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build=$BUILD" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION+$BUILD" >> $GITHUB_OUTPUT
          echo "release_name=v$VERSION ($COMMIT)" >> $GITHUB_OUTPUT

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run analyzer
        run: dart analyze --fatal-infos

      - name: Build macOS release
        run: flutter build macos --release

      - name: Compress app bundle
        run: |
          cd build/macos/Build/Products/Release
          zip -r keel-macos-${{ steps.version.outputs.version }}.zip keel.app

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.release_name }}
          body: |
            ## Keel ${{ steps.version.outputs.version }}

            Built from commit `${{ github.sha }}` on `main`.

            ### Installation
            1. Download `keel-macos-${{ steps.version.outputs.version }}.zip`
            2. Unzip and move `keel.app` to your Applications folder
            3. On first launch, right-click and select Open to bypass Gatekeeper

            ### Changes
            ${{ github.event.head_commit.message }}
          files: |
            build/macos/Build/Products/Release/keel-macos-${{ steps.version.outputs.version }}.zip
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
